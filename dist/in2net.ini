; in2net — настройки мода для «Суперсемейка: Подземная битва» (The Incredibles: Rise of the Underminer).
; Файл лежит рядом с incrotu.exe. Строка, начинающаяся с «;», — пояснение.
; Изменения применяются при следующем запуске игры.

[video]
; borderless — окно без рамки на весь монитор (разрешение рабочего стола не меняется, Alt+Tab сразу)
; window     — обычное окно
; game       — как в оригинале: полный экран поверх всего (в этом режиме мод картинку не трогает)
mode = borderless
; wide — широкий экран: кадр по форме монитора, обзор шире по бокам (по высоте — как в 4:3); интерфейс
;        и меню сохраняют пропорции и стоят в середине, фоны меню тянутся до краёв
; 4:3  — картинка 4:3, как в оригинале, по бокам чёрные поля
aspect = wide
; размер кадра игры: auto — по монитору (без рамки) или три четверти высоты рабочего стола (в окне);
; 1280x720 — свой размер; game — тот, что выбран в игре (ОПЦИИ → экран)
resolution = auto
; своя камера в сетевой игре: 1 — камера следит за вашим героем (смотрит с того же места, что и общая камера
; игры, но повёрнута на него и приближена); 0 — одна общая камера на двоих, как в оригинале.
; На саму игру это не влияет: у обоих игроков она считается одинаково, меняется только картинка.
own_camera = 1
; размер окна (только для mode = window); 0 — по размеру кадра
window_width = 0
window_height = 0
; вертикальная синхронизация: -1 — сама (в окне выключена: 60 кадров в секунду держит мод), 0 — выкл, 1 — вкл
vsync = -1
; 1 — игра продолжает идти, пока её окно не активно; 0 — ждёт (как в оригинале).
; В сетевой игре она идёт всегда: иначе второй игрок ждал бы вместе с вами.
background = 0

; --- качество картинки (на ход игры не влияет: у игроков по сети может быть разным) ---
; сглаживание краёв (MSAA): 0 — выключено, 2, 4, 8. Работает в режимах borderless и window, когда кадр
; занимает всё окно; если видеокарта столько не умеет, мод берёт меньше.
antialiasing = 4
; чёткость текстур под углом (анизотропная фильтрация): 0 — как в игре, 2, 4, 8, 16
anisotropy = 16
; резкость готового кадра: 0 — выключена … 100; 35 — умеренная
sharpen = 35
; насыщенность цветов: 0 — как в игре … 100
colors = 0

[net]
; Сетевая игра на двоих: у каждого своя копия игры и свой экран, игрок 1 — тот, кто создаёт игру (хост),
; игрок 2 — тот, кто подключается. Оба играют своими клавишами «игрока 1».
; Обычный путь — в самой игре: главное меню → «СЕТЕВАЯ ИГРА» (mode при этом остаётся off).
; В сетевой игре указатель мыши в меню выключен (кнопки мыши, назначенные действиям, в уровне работают) и
; экран «ОПЦИИ» не открывается: клавиши, кнопки мыши и громкость настройте заранее — в лаунчере (вкладки
; УПРАВЛЕНИЕ и ЗВУК) или в обычной игре.
;
; Можно и без меню, сразу при запуске:
; off  — как обычно: играть одному, вдвоём за одним компьютером или создать сетевую игру из меню
; host — создать игру: при запуске игра ждёт второго игрока (до wait секунд), потом открывается у обоих сразу
; join — подключиться к игре по адресу connect
mode = off
; чем соединяться со страницы «СЕТЕВАЯ ИГРА»: auto — через Steam, если он запущен, и по адресу;
; steam — только Steam; enet — только по адресу
transport = auto
; кто видит игру, созданную через Steam: friends — друзья, public — все, у кого стоит мод
lobby = friends
; адрес хоста: IP или имя, можно с портом (192.168.0.10 или 192.168.0.10:47820)
connect = 127.0.0.1
; порт UDP, на котором ждёт хост
port = 47820
; ваше имя в сетевой игре (латиницей); пока стоит player, берётся имя из Steam
name = player
; задержка ввода в кадрах (1…12): больше — спокойнее при плохой связи, меньше — отзывчивее
delay = 2
; сколько секунд ждать второго игрока при запуске
wait = 120

[log]
; error | warn | info | debug — подробность файла in2net.log
level = info
